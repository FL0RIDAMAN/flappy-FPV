<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy FPV</title>
<meta name="description" content="Fiber-optic one-way attack drone. Thread the nets. Tap to flap.">
<meta property="og:title" content="Flappy FPV">
<meta property="og:description" content="Fiber-optic one-way attack drone. Thread the nets. Tap to flap.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fl0ridaman.github.io/flappy-FPV/">
<meta property="og:image" content="https://fl0ridaman.github.io/flappy-FPV/icon-512.png">
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy FPV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0a0c10; color: #cfd6e0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  body { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #stage { position: relative; flex: none; border-radius: 16px; overflow: hidden; background: #1b2b4d; }
  #c { display: block; width: 100%; height: 100%; outline: none; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.10) 2px 3px); }
  #stage:focus-within { box-shadow: 0 0 0 2px #8ff0c8; }
  #bar { font-size: 12px; color: #8d97a6; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 0 12px; }
  #bar kbd { font: inherit; color: #e6ecf5; border: 1px solid #3a4452; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; }
  #bar button { font: inherit; color: #cfd6e0; background: transparent; border: 1px solid #3a4452; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  #bar button:hover { background: #161a21; }
  .touch-only { display: none; }
  @media (pointer: coarse) { .touch-only { display: inline; } .kb-only { display: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Flappy FPV: fiber-optic drone game. Press space or tap to flap."></canvas></div>
<div id="bar">
  <span class="kb-only"><kbd>space</kbd> interface command</span>
  <span class="kb-only">click also flaps, m sound, p pause</span>
  <span class="touch-only">tap to flap</span>
  <button id="theme" type="button" tabindex="-1" hidden>theme: pixel</button>
  <button id="snd" type="button" tabindex="-1" aria-pressed="true">sound on</button>
</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('c');
const stage = document.getElementById('stage');
const bar = document.getElementById('bar');
const sndBtn = document.getElementById('snd');
const themeBtn = document.getElementById('theme');
const ctx = canvas.getContext('2d');

const W = 480, GROUND_H = 70;
const H_MIN = 560, H_MAX = 880;
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
const GRAV = 1500, FLAP = -420, SPEED0 = 160;
const NET_W = 56, GAP0 = 172, GAP_MIN = 126, SPACING = 250, DX = 128;
const TOUCH = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
const KEY = TOUCH ? '[ TAP ]' : '[ SPACE ]';
const DRONE_SCALE = 0.92;          // synthwave vector drone
const PX = 2;                      // pixel theme: one sprite pixel = PX game units

// ---------- theme ----------
// 'pixel'  : 8-bit sprite art, rendered on a low-res buffer and blown up with no smoothing
// 'synth'  : 80s synthwave — neon wireframe drone, striped sun, grid floor, palms
const UNLOCK_KEY = 'flappy-fpv-unlocked';
let theme = 'pixel', unlocked = false;   // every launch starts in pixel art; synthwave is switched on per session
try { unlocked = localStorage.getItem(UNLOCK_KEY) === '1'; localStorage.removeItem('flappy-fpv-theme'); } catch (e) {}
let banner = '', bannerT = 0;          // "SYNTHWAVE MODE" flash after the secret is used
let titleTaps = 0, titleTapT = 0, titleWobble = 0;   // the secret: five quick taps on the title
function applyTheme() {
  themeBtn.textContent = theme === 'pixel' ? 'theme: pixel' : 'theme: synthwave';
  themeBtn.hidden = !unlocked;
  stage.style.background = theme === 'pixel' ? '#1b2b4d' : '#0d0322';
}
function setTheme(v) { theme = v; applyTheme(); }
function unlock() {
  unlocked = true;
  try { localStorage.setItem(UNLOCK_KEY, '1'); } catch (e) {}
}
// Semi-secret synthwave mode: toggled by tapping the title five times on the start screen.
// Once found, the theme button shows up in the bar for good on that device.
function secretToggle() {
  unlock();
  setTheme(theme === 'pixel' ? 'synth' : 'pixel');
  banner = theme === 'synth' ? 'SYNTHWAVE MODE' : 'PIXEL MODE'; bannerT = 2.2;
  SFX.unlock(theme === 'synth');
}
function titleHit(gx, gy) { return state === 'ready' && Math.abs(gx - W / 2) < 150 && gy > H * 0.15 - 16 && gy < H * 0.15 + 56; }
function titleTap() {
  const now = performance.now();
  if (now - titleTapT > 1200) titleTaps = 0;
  titleTapT = now; titleTaps++; titleWobble = 1;
  SFX.titleTap(titleTaps);
  if (titleTaps >= 5) { titleTaps = 0; secretToggle(); }
}
themeBtn.addEventListener('click', () => { setTheme(theme === 'pixel' ? 'synth' : 'pixel'); canvas.focus({ preventScroll: true }); });
applyTheme();

let H = H_MIN, GY = H - GROUND_H, VIG = null, scale = 1;
const lo = document.createElement('canvas');         // low-res buffer for the pixel theme
const lctx = lo.getContext('2d');
let sunCache = null, synthCache = null, cityCache = null, waterGrad = null, hazeGrad = null, hazeFor = '';               // synthwave backdrops, drawn once per size
// the synthwave city loop: its length in far-layer units, each layer's speed as a fraction of course speed, strip geometry
const CITY_P = 0.15, WATER_P = 0.22, NEAR_P = 0.35, CITY_BASE = 200, CITY_H = 216, HZ_UP = 50;
// The landmarks are drawn in their own "art units"; CITY_S scales the whole far layer up to game units and shrinks
// on short screens so the skyline never climbs into the flight path. CITY_LOOP is one lap of the world in game units.
let CITY_S = 1.4, CITY_LOOP = 3400 * CITY_S;

function avail() {
  // Space the game can actually use: the viewport minus the body's padding (which is the
  // phone's safe area: notch / status bar at the top, home indicator at the bottom when the
  // game is launched from the home screen) minus the control bar under the canvas.
  const cs = getComputedStyle(document.body);
  const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  const vv = window.visualViewport;
  const vw = (vv ? vv.width : window.innerWidth) - padX;
  const vh = (vv ? vv.height : window.innerHeight) - padY;
  const barH = bar.offsetHeight || 30;
  return { w: Math.max(200, vw - 16), h: Math.max(200, vh - barH - 24) };
}
function pickH() {
  const a = avail();
  const h = Math.min(H_MAX, Math.max(H_MIN, W * a.h / a.w));
  return Math.round(h / PX) * PX;        // keep H on the pixel grid
}
function makeVig() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  return g;
}
function applyH(h) {
  H = h; GY = H - GROUND_H; VIG = makeVig(); lo.width = W / PX; lo.height = H / PX; sunCache = null; synthCache = null;
  CITY_S = 1.4 * Math.min(1, Math.max(0.6, (H - GROUND_H - HZ_UP) / 760)); CITY_LOOP = 3400 * CITY_S; cityCache = null; waterGrad = null;
}
function fit() {
  const a = avail();
  const s = Math.max(0.3, Math.min(a.w / W, a.h / H));
  stage.style.width = Math.round(W * s) + 'px';
  stage.style.height = Math.round(H * s) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = s * dpr;
  cityCache = null;   // the baked skyline is rendered at device resolution, so it follows the scale
  canvas.width = Math.round(W * scale);
  canvas.height = Math.round(H * scale);
}

// ---------- audio ----------
let soundOn = true, AC = null;
function ac() {
  if (AC === null) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, type, vol, slide) {
  if (!soundOn) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur);
}
function noise(dur, vol) {
  if (!soundOn) return;
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) { const k = 1 - i / n; d[i] = (Math.random() * 2 - 1) * k * k; }
  const s = a.createBufferSource(); s.buffer = b;
  const g = a.createGain(); g.gain.value = vol;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
function unlockAudio() { if (soundOn) ac(); }
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  sndBtn.textContent = soundOn ? 'sound on' : 'sound off';
  sndBtn.setAttribute('aria-pressed', String(soundOn));
  if (soundOn) ac();
  canvas.focus({ preventScroll: true });
});


// ---------- synthwave sound kit ----------
// Everything is synthesized on the fly with the Web Audio API — no sound files to download.
// The 80s vocabulary: LinnDrum-style kick and snare, the snare through a GATED REVERB (a big room
// that slams shut), 808 handclap and cowbell, Simmons electronic toms with the pitch drop,
// detuned-saw brass stabs, an arcade laser zap, and a tape-stop power-down for the crash.
let noiseBuffer = null, verbBuffer = null, master = null;
function bus(a) { if (!master) { master = a.createGain(); master.gain.value = 0.7; master.connect(a.destination); } return master; }
function noiseBuf(a) {
  if (!noiseBuffer) { const n = a.sampleRate; noiseBuffer = a.createBuffer(1, n, a.sampleRate); const d = noiseBuffer.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuffer;
}
function verbBuf(a) {   // impulse response of a big bright room: half a second of decaying noise
  if (!verbBuffer) { const len = Math.floor(a.sampleRate * 0.5); verbBuffer = a.createBuffer(2, len, a.sampleRate); for (let ch = 0; ch < 2; ch++) { const d = verbBuffer.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2); } }
  return verbBuffer;
}
function sNoise(a, t0, dur, vol, ftype, freq, q) {   // filtered noise burst with an exponential decay; returns its gain node
  const src = a.createBufferSource(); src.buffer = noiseBuf(a);
  const f = a.createBiquadFilter(); f.type = ftype || 'bandpass'; f.frequency.value = freq || 1500; if (q) f.Q.value = q;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f).connect(g).connect(bus(a)); src.start(t0); src.stop(t0 + dur + 0.02);
  return g;
}
function gated(a, t0, hold, vol) {   // the gated reverb: feed it a sound; the room holds for `hold` seconds then cuts dead
  const c = a.createConvolver(); c.buffer = verbBuf(a);
  const g = a.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.setValueAtTime(vol, t0 + hold); g.gain.linearRampToValueAtTime(0.0001, t0 + hold + 0.02);
  c.connect(g).connect(bus(a));
  return c;
}
function sKick(a, t0, vol) {
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(165, t0); o.frequency.exponentialRampToValueAtTime(48, t0 + 0.11);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
  o.connect(g).connect(bus(a)); o.start(t0); o.stop(t0 + 0.35);
  sNoise(a, t0, 0.006, vol * 0.5, 'highpass', 2500);
}
function sSnare(a, t0, vol) {   // snare body + noise, both also sent through the gate
  const gate = gated(a, t0, 0.17, 1.3);
  const o = a.createOscillator(), og = a.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(210, t0); o.frequency.exponentialRampToValueAtTime(140, t0 + 0.06);
  og.gain.setValueAtTime(vol, t0); og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
  o.connect(og); og.connect(bus(a)); og.connect(gate); o.start(t0); o.stop(t0 + 0.16);
  const n = sNoise(a, t0, 0.2, vol * 1.1, 'bandpass', 1800, 0.6); n.connect(gate);
}
function sClap(a, t0, vol) {    // four quick slaps then a tail, through the gate
  const gate = gated(a, t0, 0.14, 1.6);
  for (let i = 0; i < 4; i++) sNoise(a, t0 + i * 0.011, 0.014, vol, 'bandpass', 1300, 0.9).connect(gate);
  sNoise(a, t0 + 0.04, 0.22, vol * 0.9, 'bandpass', 1200, 0.7).connect(gate);
}
function sCowbell(a, t0, vol) {
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 1.4;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
  for (const fr of [540, 800]) { const o = a.createOscillator(); o.type = 'square'; o.frequency.value = fr; o.connect(f); o.start(t0); o.stop(t0 + 0.3); }
  f.connect(g).connect(bus(a));
}
function sTom(a, t0, f0, vol) { // Simmons-style electronic tom: sine with a fast pitch drop and a click
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f0 * 0.35, t0 + 0.22);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
  o.connect(g).connect(bus(a)); o.start(t0); o.stop(t0 + 0.32);
  sNoise(a, t0, 0.02, vol * 0.45, 'highpass', 1500);
}
function sStab(a, t0, notes, vol, dur) {   // detuned-saw brass stab with a closing filter
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(3200, t0); f.frequency.exponentialRampToValueAtTime(350, t0 + dur);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  for (const n of notes) for (const det of [-7, 7]) { const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = n; o.detune.value = det; o.connect(f); o.start(t0); o.stop(t0 + dur + 0.02); }
  f.connect(g).connect(bus(a));
}
function sZap(a, t0, vol) {
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(1900, t0); o.frequency.exponentialRampToValueAtTime(140, t0 + 0.22);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
  o.connect(g).connect(bus(a)); o.start(t0); o.stop(t0 + 0.27);
}
function sTapeStop(a, t0, vol) {   // power-down: a saw chord slides down while the filter closes
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(2500, t0); f.frequency.exponentialRampToValueAtTime(120, t0 + 0.7);
  const g = a.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.75);
  for (const n of [220, 277, 330]) { const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(n, t0); o.frequency.exponentialRampToValueAtTime(n / 2.8, t0 + 0.7); o.connect(f); o.start(t0); o.stop(t0 + 0.77); }
  f.connect(g).connect(bus(a));
}
function sHat(a, t0, vol) { sNoise(a, t0, 0.05, vol, 'highpass', 7000); }

// One entry point per game event; each picks the chip sound (pixel) or the 80s sound (synthwave).
function play(fn) { if (!soundOn) return; const a = ac(); if (!a) return; fn(a, a.currentTime); }
const SFX = {
  flap() { if (theme === 'synth') play((a, t) => sTom(a, t, 300, 0.2)); else tone(480, 0.09, 'square', 0.035, 760); },
  arm() { if (theme === 'synth') play((a, t) => { sKick(a, t, 0.5); sStab(a, t, [220, 261.6, 329.6], 0.11, 0.35); }); else tone(880, 0.05, 'square', 0.04); },
  score(n) {
    if (theme === 'synth') play((a, t) => { sClap(a, t, 1.0); if (n % 5 === 0) sCowbell(a, t + 0.03, 0.22); });
    else { tone(1200, 0.05, 'square', 0.04); setTimeout(() => tone(1600, 0.07, 'square', 0.04), 60); }
  },
  crash() {
    if (theme === 'synth') play((a, t) => { sSnare(a, t, 0.5); sNoise(a, t, 0.7, 0.5, 'lowpass', 500); sZap(a, t + 0.02, 0.1); sTapeStop(a, t + 0.08, 0.12); });
    else { noise(0.7, 0.35); tone(160, 0.6, 'sawtooth', 0.07, 30); }
  },
  panel(isBest) {   // when the LINK LOST panel appears: a tom fill, plus cowbell + stab for a new best
    if (theme !== 'synth') return;
    play((a, t) => {
      sTom(a, t, 420, 0.28); sTom(a, t + 0.14, 300, 0.3); sTom(a, t + 0.28, 200, 0.34);
      if (isBest) { sCowbell(a, t + 0.5, 0.22); sCowbell(a, t + 0.65, 0.22); sStab(a, t + 0.8, [261.6, 329.6, 392, 523.3], 0.12, 0.6); }
    });
  },
  unlock(on) {      // the secret sting: into synthwave = zap + rising brass arpeggio; back to pixel = chip arpeggio
    if (on) play((a, t) => { sZap(a, t, 0.1); [220, 277, 330, 440].forEach((n, i) => sStab(a, t + 0.1 + i * 0.11, [n, n * 1.5], 0.1, 0.3)); sSnare(a, t + 0.55, 0.4); });
    else [880, 659, 554, 440].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.04), i * 70));
  },
  titleTap(n) { if (theme === 'synth') play((a, t) => sHat(a, t, 0.55)); else tone(660 + n * 60, 0.05, 'square', 0.03); },
};

// ---------- world generation (deterministic) ----------
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
function makeTrees(seed, span, minH, maxH, minW, maxW) {
  const r = rng(seed), a = []; let x = 0;
  while (x < span) {
    const h = minH + r() * (maxH - minH), w = minW + r() * (maxW - minW);
    a.push({ x, w, h, round: r() < 0.35 });
    x += w * 0.7 + r() * 16;
  }
  return { a, span };
}
const FAR = makeTrees(7, 760, 26, 64, 16, 34);
const NEAR = makeTrees(21, 760, 64, 140, 22, 46);
// synthwave: near palms (the skyline lives in the city loop further down)
const PALMS = (() => { const r = rng(5), a = []; let x = 10; while (x < 760) { a.push({ x, h: 70 + r() * 80, lean: (r() - 0.5) * 30, fr: 6 + Math.floor(r() * 3) }); x += 110 + r() * 120; } return { a, span: 760 }; })();
const STARS = (() => { const r = rng(3), a = []; for (let i = 0; i < 70; i++) a.push({ x: r() * W, y: r() * 0.5, s: r() < 0.25 ? 2 : 1, ph: r() * 6.28 }); return a; })();

// ---------- state ----------
const BEST_KEY = 'flappy-fpv-best';
function loadBest() { try { return Math.max(0, parseInt(localStorage.getItem(BEST_KEY), 10) || 0); } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }

// state: 'ready' (title screen) -> 'play' -> 'dead' (crash screen); 'paused' sits between play frames
let state = 'ready', score = 0, best = loadBest(), newBest = false, t = 0;
let readyGrace = 0;   // seconds left during which the menu ignores arm taps (so a crash-screen tap can't start a new round)
let D, nets, fiber, parts, dist, speed, gap, gOff, gScroll, f1, f2, fc, cause, deadT, flash, shake, bat, fly;

function mkNet(x) {
  const m = 52;
  return { x, gapY: m + Math.random() * (GY - 2 * m - gap), gapH: gap, passed: false };
}
function reset() {
  D = { x: DX, y: H * 0.44, vy: 0, ang: 0 };
  nets = []; fiber = []; parts = [];
  dist = 0; score = 0; speed = SPEED0; gap = GAP0;
  gOff = 0; gScroll = 0; f1 = 0; f2 = 0; fc = Math.random() * CITY_LOOP; cause = ''; deadT = 0; flash = 0; shake = 0; bat = 25.2; fly = 0; newBest = false;
  let x = W + 160;
  for (let i = 0; i < 3; i++) { nets.push(mkNet(x)); x += SPACING; }
  for (let fx = -40; fx <= D.x; fx += 4) fiber.push({ x: fx, y: D.y + 12 });
}

function layout() {
  const h = pickH();

// ---- Park Tower (1972, 458 ft): a slab of full-height white fins with dark glass between, blank white corner piers,

// ---- Rivergate Tower / Sykes (1988, 454 ft, "the beer can"): limestone cylinder, tight grid of small square windows

// ---- Tampa Theatre (1926): brick office block above, cast-stone arched entry, the bulb-lined marquee with black
//      attraction boards and neon medallions, and the vertical TAMPA blade sign with its scrolled crest
function tampaTheatre(c, x, b) {
  const w = 54, hb = 76, top = b - hb, brick = MV.amber;
  body(c, () => { c.beginPath(); c.rect(x, top, w, hb); }, brick);
  // cornice + parapet
  body(c, () => { c.beginPath(); c.rect(x - 1.5, top - 2.5, w + 3, 3); }, brick);
  trim(c, () => { c.beginPath(); for (let i = 2; i < w + 3; i += 2.4) { c.moveTo(x - 1.5 + i, top - 2.5); c.lineTo(x - 1.5 + i, top - 1); } }, brick, 0.5, true);
  // vertical window bays (4 bays x 8 floors)
  for (let k = 0; k < 4; k++) { const bx = x + 8 + k * 12; trim(c, () => { c.beginPath(); c.rect(bx, top + 3, 6.5, hb - 30); }, brick, 0.5, true); for (let f = 0; f < 8; f++) { seed = 30 + k * 8 + f; c.fillStyle = MV.amber; c.globalAlpha = rnd() < 0.55 ? 0.6 : 0.2; c.fillRect(bx + 1, top + 5 + f * 5.6, 4.5, 3.4); } c.globalAlpha = 1; }
  // ornate cast-stone entry: big central arch and two side arches, ticket booth in the middle
  trim(c, () => { c.beginPath(); c.moveTo(x + 1.5, b - 26); c.lineTo(x + w - 1.5, b - 26); }, MV.silver, 0.6, true);
  arch(c, x + w / 2, b - 24, 12, 24, MV.silver, 0.12);
  arch(c, x + 8, b - 16, 7, 16, MV.silver, 0.12); arch(c, x + w - 8, b - 16, 7, 16, MV.silver, 0.12);
  body(c, () => rr(c, x + w / 2 - 3, b - 9, 6, 9, 1), MV.yellow, 0.7);
  // the marquee: a long canopy projecting off the facade, chasing bulbs on both edges, lit underside
  const my = b - 34, mh = 8, mx0 = x - 7, mx1 = x + w + 7;
  if (BK) BK.marquee = { x0: mx0 + 1, x1: mx1 - 1, y1: my + 1.4, y2: my + mh - 1.2, y3: my + mh + 1.1 };
  lit(c, () => { c.beginPath(); c.rect(mx0 + 2, my + mh, mx1 - mx0 - 4, 2.2); }, MV.yellow, 0.2, 0.5);
  body(c, () => { c.beginPath(); c.rect(mx0, my, mx1 - mx0, mh); }, MV.yellow, 0.7);
  trim(c, () => { c.beginPath(); c.moveTo(mx0, my); c.lineTo(mx1, my); }, MV.green, 0.9);
  bulbs(c, mx0 + 1, my + 1.4, mx1 - 1, my + 1.4, 1.5, MV.yellow, 0.5);
  bulbs(c, mx0 + 1, my + mh - 1.2, mx1 - 1, my + mh - 1.2, 1.5, MV.yellow, 0.5);
  bulbs(c, mx0 + 1, my + mh + 1.1, mx1 - 1, my + mh + 1.1, 1.5, MV.white, 0.45);
  // black attraction boards with tiny white letter rows
  for (const [bx, bw] of [[mx0 + 3, 10], [mx0 + 20, 22], [mx0 + 49, 12]]) { c.fillStyle = '#000'; c.fillRect(bx, my + 2.4, bw, mh - 4.4); c.fillStyle = MV.white; c.globalAlpha = 0.85; for (let r = 0; r < 2; r++) for (let i = 0; i < bw - 2; i += 1.4) if (((i * 7 + r * 3 + bx) | 0) % 5 !== 0) c.fillRect(bx + 1 + i, my + 3.2 + r * 1.8, 0.9, 0.9); c.globalAlpha = 1; }
  // neon medallion panels (pink frames, double blue ovals) between the boards
  for (const px of [mx0 + 14.5, mx0 + 43.5, mx1 - 3.5]) { sign(c, px - 1.6, my - 2, 3.2, mh + 2.5, MV.pink); dot(c, px, my + 1.3, 0.8, MV.blue); dot(c, px, my + 4.4, 0.8, MV.blue); }
  neonText(c, 'TAMPA', mx0 + 8.5, my + 4.2, 3.4, MV.white, { font: 'cursive', weight: 'italic bold' });
  // the blade sign: mounted on the corner above the marquee
  const sx = x + 11, T = b - 92, B = my - 1;
  const blade = () => { c.beginPath(); c.moveTo(sx - 6, B - 7); c.lineTo(sx - 7.8, B - 6); c.lineTo(sx - 7.8, B - 2.8); c.quadraticCurveTo(sx - 4, B - 1.2, sx, B); c.quadraticCurveTo(sx + 4, B - 1.2, sx + 7.8, B - 2.8); c.lineTo(sx + 7.8, B - 6); c.lineTo(sx + 6, B - 7); c.lineTo(sx + 6, T + 11); c.lineTo(sx + 8.2, T + 11); c.lineTo(sx + 8.2, T + 7.5); c.quadraticCurveTo(sx + 6.5, T + 4, sx + 5, T + 4.5); c.arc(sx, T + 4.5, 5, 0, Math.PI, true); c.quadraticCurveTo(sx - 6.5, T + 4, sx - 8.2, T + 7.5); c.lineTo(sx - 8.2, T + 11); c.lineTo(sx - 6, T + 11); c.closePath(); };
  trim(c, () => { c.beginPath(); c.moveTo(sx + 6, B - 4); c.lineTo(sx + 12, B - 2); c.moveTo(sx + 6, T + 14); c.lineTo(sx + 12, T + 16); }, MV.silver, 0.6, true);
  body(c, blade, MV.white, 1);
  c.save(); c.globalAlpha = 0.35; c.strokeStyle = MV.white; c.lineWidth = 0.5; blade(); c.stroke(); c.restore();
  bulbs(c, sx - 6, B - 8, sx - 6, T + 12, 1.6, MV.yellow, 0.42); bulbs(c, sx + 6, B - 8, sx + 6, T + 12, 1.6, MV.yellow, 0.42);
  neonText(c, 'TAMPA', sx, T + 16, 8.6, MV.white, { vertical: true, gap: 8.1 });
}

// ---- Henry B. Plant Museum / Plant Hall (1891): long Moorish-revival brick hall with a horseshoe-arched veranda,
//      keyhole windows, a domed central pavilion and six silver minarets with onion domes and crescent finials
function plantHall(c, x, b) {
  const col = MV.glow, W = 124, h = 30, top = b - h;
  body(c, () => { c.beginPath(); c.rect(x, top, W, h); }, col);
  c.fillStyle = rgba(col, 0.09); c.fillRect(x + 0.6, top + 0.6, W - 1.2, h - 1.2);
  // central pavilion + dome
  body(c, () => { c.beginPath(); c.rect(x + 46, top - 12, 32, 12); }, col);
  c.fillStyle = rgba(col, 0.09); c.fillRect(x + 46.6, top - 11.4, 30.8, 11);
  accent(c, () => { c.beginPath(); c.moveTo(x + 52, top - 12); c.quadraticCurveTo(x + 52, top - 24, x + 62, top - 25); c.quadraticCurveTo(x + 72, top - 24, x + 72, top - 12); c.closePath(); }, MV.silver);
  trim(c, () => { c.beginPath(); c.moveTo(x + 62, top - 25); c.lineTo(x + 62, top - 30); }, MV.yellow, 0.8);
  for (let k = 0; k < 3; k++) horseshoe(c, x + 54 + k * 8, top - 10, 4.4, 7, MV.yellow, 0.3);
  // upper floor keyhole windows, ground floor veranda of horseshoe arches, porch roof line
  for (let ax = x + 5; ax < x + W - 2; ax += 7) { if (ax > x + 44 && ax < x + 80) continue; horseshoe(c, ax, top + 4, 3.6, 7, col, 0.35); }
  trim(c, () => { c.beginPath(); c.moveTo(x - 3, top + 15); c.lineTo(x + W + 3, top + 15); }, MV.silver, 0.8);
  for (let ax = x + 5; ax < x + W - 2; ax += 8) horseshoe(c, ax, top + 17, 5.6, 13, MV.silver, 0.12);
  trim(c, () => { c.beginPath(); for (let ax = x + 1; ax < x + W; ax += 8) { c.moveTo(ax, top + 15); c.lineTo(ax, b); } }, MV.silver, 0.5, true);
  // small cupolas
  for (const cx of [x + 22, x + 102]) accent(c, () => { c.beginPath(); c.moveTo(cx - 5, top); c.quadraticCurveTo(cx - 5, top - 8, cx, top - 8.5); c.quadraticCurveTo(cx + 5, top - 8, cx + 5, top); c.closePath(); }, MV.silver);
  // six minarets: tapered octagonal shafts with balcony rings, onion domes, crescents
  const mins = [[6, 52], [30, 66], [48, 58], [78, 74], [96, 56], [116, 68]];
  for (const [mx0, mh] of mins) {
    const mx = x + mx0, mt = b - mh, base = (mx0 > 40 && mx0 < 84) ? top - 12 : top;
    body(c, () => { c.beginPath(); c.moveTo(mx - 2.8, base); c.lineTo(mx - 2.1, mt); c.lineTo(mx + 2.1, mt); c.lineTo(mx + 2.8, base); c.closePath(); }, MV.silver, 0.8);
    for (const ry of [0.4, 0.68]) { const yy = mt + (base - mt) * ry; body(c, () => { c.beginPath(); c.rect(mx - 3.3, yy, 6.6, 1.5); }, MV.silver, 0.6); }
    c.fillStyle = MV.yellow; c.globalAlpha = 0.7; for (let yy = mt + 4; yy < base - 4; yy += 6) c.fillRect(mx - 0.5, yy, 1, 2); c.globalAlpha = 1;
    // onion dome: bulb a little wider than the shaft, drawn up to a point
    accent(c, () => { c.beginPath(); c.moveTo(mx, mt - 11); c.bezierCurveTo(mx + 2.2, mt - 10.5, mx + 4.4, mt - 7.5, mx + 3.8, mt - 3); c.quadraticCurveTo(mx + 3.2, mt, mx + 2.4, mt); c.lineTo(mx - 2.4, mt); c.quadraticCurveTo(mx - 3.2, mt, mx - 3.8, mt - 3); c.bezierCurveTo(mx - 4.4, mt - 7.5, mx - 2.2, mt - 10.5, mx, mt - 11); c.closePath(); }, MV.silver);
    // finial spike and crescent moon (two arcs)
    trim(c, () => { c.beginPath(); c.moveTo(mx, mt - 11); c.lineTo(mx, mt - 15); }, MV.yellow, 0.7);
    c.beginPath(); c.arc(mx, mt - 18, 3, Math.PI * 0.27, Math.PI * 1.73, false); c.arc(mx + 1.5, mt - 18, 2.3, Math.PI * 1.568, Math.PI * 0.432, true); c.closePath();
    c.globalAlpha = 0.3; c.strokeStyle = MV.yellow; c.lineWidth = 1.4; c.stroke(); c.globalAlpha = 1; c.fillStyle = MV.yellow; c.fill();
  }
}

// ---- Sunshine Skyway Bridge (1987): a long high-level deck on many piers rising to the main span, two single concrete
//      pylons that pass straight through the deck to the water, yellow stays fanning from each pylon in one plane
function skyway(c, x, wl) {
  const L = 340, p1 = x + 122, p2 = x + 218, deckTop = wl - 44, deckEnd = wl - 9;
  // deck profile: flat across the main span, then a long smooth descent to each end
  const deckY = (px) => { const flat = 22; let d = 0; if (px < p1 - flat) d = (p1 - flat - px) / 112; else if (px > p2 + flat) d = (px - p2 - flat) / 112; d = Math.min(1, Math.max(0, d)); const s = d * d * (3 - 2 * d); return deckTop + (deckEnd - deckTop) * s; };
  // approach piers
  c.beginPath(); for (let px = x + 4; px < x + L; px += 13) { if (Math.abs(px - p1) < 6 || Math.abs(px - p2) < 6) continue; c.moveTo(px, deckY(px) + 1); c.lineTo(px, wl + 2); }
  glowStroke(c, MV.silver, 0.7, 3, 0.2);
  // pylons: single concrete columns straight through the deck to the water, on a wider pier below
  for (const px of [p1, p2]) {
    const ptop = deckTop - 66;
    body(c, () => { c.beginPath(); c.moveTo(px - 5.5, wl + 2); c.lineTo(px - 4.2, deckTop + 3); c.lineTo(px - 2.4, ptop); c.lineTo(px + 2.4, ptop); c.lineTo(px + 4.2, deckTop + 3); c.lineTo(px + 5.5, wl + 2); c.closePath(); }, MV.white, 1);
    // stays: 12 per side in one plane, anchored down the upper part of the pylon, landing along the deck
    c.beginPath(); for (let k = 0; k < 12; k++) { const ay = ptop + 2.5 + k * 3.6, dx = 10 + k * 8.2; c.moveTo(px, ay); c.lineTo(px - dx, deckY(px - dx) - 1); c.moveTo(px, ay); c.lineTo(px + dx, deckY(px + dx) - 1); }
    glowStroke(c, MV.yellow, 0.55, 2.6, 0.22);
    beacon(c, px, ptop - 1, 1);
  }
  // the deck, drawn last so it sits over the stays and piers, with lights along it
  c.beginPath(); c.moveTo(x - 6, deckEnd + 2); for (let px = x - 6; px <= x + L + 6; px += 4) c.lineTo(px, deckY(px)); glowStroke(c, MV.white, 2.4, 8, 0.28);
  c.beginPath(); c.moveTo(x - 6, deckEnd + 3.2); for (let px = x - 6; px <= x + L + 6; px += 4) c.lineTo(px, deckY(px) + 1.6); glowStroke(c, MV.silver, 0.6, 2, 0.15);
  for (let px = x + 2; px < x + L; px += 20) dot(c, px, deckY(px) - 2, 0.7, MV.yellow, 0.9);
}

// ---- Sulphur Springs Water Tower (1927, 214 ft): white concrete shaft on buttress fins, slit windows, a flared collar
//      near the top and a narrower castellated crown above it
function sulphur(c, x, b) {
  const w = 12, h = 100, top = b - h, cx = x + w / 2, col = MV.white;
  // buttress fins at the foot
  body(c, () => { c.beginPath(); c.moveTo(x - 8, b); c.lineTo(x, b - 18); c.lineTo(x, b); c.closePath(); c.moveTo(x + w + 8, b); c.lineTo(x + w, b - 18); c.lineTo(x + w, b); c.closePath(); c.moveTo(cx - 3.5, b); c.lineTo(cx - 1, b - 14); c.lineTo(cx + 1, b - 14); c.lineTo(cx + 3.5, b); c.closePath(); }, col, 0.8);
  // shaft (white concrete, shaded round)
  body(c, () => { c.beginPath(); c.rect(x, top + 14, w, h - 14); }, col);
  cylShade(c, x + 0.6, top + 14.6, w - 1.2, h - 15.2, col, 0.5);
  c.fillStyle = MV.yellow; c.globalAlpha = 0.8; for (const [sx, sy] of [[3, 30], [8, 44], [3, 58], [8, 70], [3, 82]]) c.fillRect(x + sx, top + sy, 1, 3); c.globalAlpha = 1;
  // flared collar with its lip
  body(c, () => { c.beginPath(); c.moveTo(x, top + 14); c.lineTo(x - 4, top + 8.5); c.lineTo(x + w + 4, top + 8.5); c.lineTo(x + w, top + 14); c.closePath(); }, col, 0.9);
  body(c, () => { c.beginPath(); c.rect(x - 4.8, top + 6.5, w + 9.6, 2.2); }, col, 0.8);
  // castellated crown: narrower drum with merlons and dark slots
  body(c, () => { c.beginPath(); c.moveTo(x + 1, top + 6.5); c.lineTo(x + 1, top); c.lineTo(x + 2.6, top); c.lineTo(x + 2.6, top - 2.4); c.lineTo(x + 4.4, top - 2.4); c.lineTo(x + 4.4, top); c.lineTo(x + 5.6, top); c.lineTo(x + 5.6, top - 2.4); c.lineTo(x + 7.4, top - 2.4); c.lineTo(x + 7.4, top); c.lineTo(x + 8.6, top); c.lineTo(x + 8.6, top - 2.4); c.lineTo(x + 10.4, top - 2.4); c.lineTo(x + 10.4, top); c.lineTo(x + w - 1, top); c.lineTo(x + w - 1, top + 6.5); c.closePath(); }, col, 0.8);
  cylShade(c, x + 1.6, top + 0.6, w - 3.2, 5.4, col, 0.3);
  c.fillStyle = MV.ink; for (const sx of [3.2, 5.9, 8.6]) c.fillRect(x + sx, top + 1.2, 0.9, 4);
  cylShade(c, x - 3.4, top + 9, w + 6.8, 4.6, col, 0.2);
  beacon(c, cx, top - 4, 1.2);
}

// ---- Centro Ybor (7th Avenue): the cream centre block with its bowed balcony and canopy, brick pilasters and
//      two-storey brick wings with green walkway roofs, the five-globe lamp posts, and up on the roof the steel-framed
//      CENTRO [senorita medallion] YBOR sign in salmon letters
function centroYbor(c, x, b) {
  const brick = MV.amber, cream = MV.silver, W = 118, cx = x + W / 2;
  // side wings
  for (const wx of [x, x + W - 30]) {
    body(c, () => { c.beginPath(); c.rect(wx, b - 30, 30, 30); }, brick, 0.9);
    c.fillStyle = rgba(brick, 0.1); c.fillRect(wx + 0.6, b - 29.4, 28.8, 28.8);
    body(c, () => { c.beginPath(); c.rect(wx - 1, b - 32, 32, 2.2); }, cream, 0.6);
    c.fillStyle = rgba(MV.teal, 0.35); for (let k = 0; k < 3; k++) c.fillRect(wx + 3.5 + k * 9, b - 28, 6, 5);
    // green walkway roof, posts and railing, ground-floor openings

// ---- TECO Line streetcar (near layer): yellow Birney replica car — arched roof with the raised monitor, letterboard,
//      a row of framed windows with the brass safety rail, red folding doors at each end, 434 numbers, the TECO Line
//      roundel, two trucks underneath and the trolley pole reaching up to the wire
function streetcar(c, x, b) {
  const L = 66, top = b - 19, yel = MV.yellow, red = MV.red;
  // wire
  c.beginPath(); c.moveTo(x - 20, b - 36.5); c.lineTo(x + L + 20, b - 36.5); glowStroke(c, MV.silver, 0.4, 2, 0.15);
  // trucks + wheels
  for (const tx of [x + 15, x + L - 15]) { body(c, () => { c.beginPath(); c.rect(tx - 7, b - 4.5, 14, 3.2); }, MV.silver, 0.6); for (const wx of [tx - 4, tx + 4]) { dot(c, wx, b - 1.9, 1.9, MV.ink); c.beginPath(); c.arc(wx, b - 1.9, 1.9, 0, Math.PI * 2); glowStroke(c, MV.silver, 0.6, 2.5, 0.3); } }
  // body
  body(c, () => rr(c, x, top, L, 15.5, 1.2), yel, 0.9);
  c.fillStyle = rgba(yel, 0.4); c.fillRect(x + 0.6, top + 0.6, L - 1.2, 14.3);
  // steps under the doors
  body(c, () => { c.beginPath(); c.rect(x + 1.5, b - 3.8, 6, 1.4); c.rect(x + L - 7.5, b - 3.8, 6, 1.4); }, yel, 0.5);
  // roof: low arch plus the raised monitor with its little windows
  body(c, () => { c.beginPath(); c.moveTo(x + 0.5, top); c.quadraticCurveTo(x + 2, top - 2.6, x + 6, top - 2.6); c.lineTo(x + L - 6, top - 2.6); c.quadraticCurveTo(x + L - 2, top - 2.6, x + L - 0.5, top); c.closePath(); }, red, 0.8);
  body(c, () => { c.beginPath(); c.moveTo(x + 9, top - 2.6); c.quadraticCurveTo(x + 10, top - 5, x + 13, top - 5); c.lineTo(x + L - 13, top - 5); c.quadraticCurveTo(x + L - 10, top - 5, x + L - 9, top - 2.6); c.closePath(); }, red, 0.7);
  c.fillStyle = rgba(MV.teal, 0.5); for (let i = 0; i < 9; i++) c.fillRect(x + 14 + i * 4.4, top - 4.2, 2.6, 1.1);
  // letterboard text (dark lettering on yellow)
  c.fillStyle = MV.ink; c.globalAlpha = 0.75; for (let i = 0; i < 26; i++) if (i % 5 !== 4) c.fillRect(x + 12 + i * 1.6, top + 1.4, 1.1, 0.9); c.globalAlpha = 1;
  // windows with maroon frames and the brass rail
  for (let i = 0; i < 8; i++) { const wx = x + 9.5 + i * 5.9; c.fillStyle = rgba(MV.teal, 0.42); c.fillRect(wx, top + 3.2, 4.9, 6.2); c.strokeStyle = red; c.lineWidth = 0.55; c.globalAlpha = 0.9; c.strokeRect(wx, top + 3.2, 4.9, 6.2); c.beginPath(); c.moveTo(wx, top + 5); c.lineTo(wx + 4.9, top + 5); c.stroke(); c.globalAlpha = 1; }
  trim(c, () => { c.beginPath(); c.moveTo(x + 9.5, top + 7); c.lineTo(x + L - 9.5, top + 7); }, yel, 0.45, true);
  // red folding doors at both ends
  for (const dx of [x + 2.2, x + L - 7.2]) { c.fillStyle = rgba(MV.teal, 0.3); c.fillRect(dx, top + 3.2, 5, 10.5); c.strokeStyle = red; c.lineWidth = 0.7; c.strokeRect(dx, top + 3.2, 5, 10.5); c.lineWidth = 0.45; c.beginPath(); for (let k = 1; k < 4; k++) { c.moveTo(dx + k * 1.25, top + 3.2); c.lineTo(dx + k * 1.25, top + 13.7); } c.stroke(); }
  // car number and the roundel
  c.font = 'bold 2.6px ' + MONO; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = MV.ink; c.fillText('434', x + 13.5, top + 11.8); c.fillText('434', x + L - 13.5, top + 11.8);
  accent(c, () => { c.beginPath(); c.rect(x + L / 2 - 1, top + 11.3, 7, 2.2); }, red);
  dot(c, x + L / 2 + 8.5, top + 12.2, 3, MV.ink); c.beginPath(); c.arc(x + L / 2 + 8.5, top + 12.2, 3, 0, Math.PI * 2); glowStroke(c, yel, 0.6, 2.5, 0.35);
  neonText(c, 'TECO', x + L / 2 + 8.5, top + 12.4, 2.2, yel);
  // trolley pole to the wire
  c.beginPath(); c.moveTo(x + L / 2 - 4, top - 5); c.lineTo(x + L / 2 + 15, b - 36.5); glowStroke(c, MV.silver, 0.6, 2.5, 0.25);
  dot(c, x + L / 2 + 15, b - 36.5, 0.8, MV.white);
}


// ================= MIAMI LANDMARKS  (x = left edge, b = baseline)  — all drawn from memory =================

// small palm for foregrounds and courtyards (the big scene palm is far too leafy at this size)
function miniPalm(c, x, base, h, lean, fr) {
  const tx = x + lean, ty = base - h, L = h * 0.55;
  c.beginPath(); c.moveTo(x, base); c.quadraticCurveTo(x + lean * 0.3, base - h * 0.6, tx, ty); glowStroke(c, '#b04dff', 0.9, 3, 0.2);
  for (let i = 0; i < fr; i++) { const a = -Math.PI * 0.9 + (i / (fr - 1)) * Math.PI * 0.8; c.beginPath(); c.moveTo(tx, ty); c.quadraticCurveTo(tx + Math.cos(a) * L * 0.6, ty + Math.sin(a) * L * 0.6 - 2, tx + Math.cos(a) * L, ty + Math.sin(a) * L * 0.5 + L * 0.35); glowStroke(c, '#b04dff', 0.8, 2.5, 0.2); }
}

// ---- Atlantis Condominium (Brickell, Arquitectonica 1982): the blue glass slab with the white grid, the square
//      sky-court punched through it (red spiral stair, palm, jacuzzi), the red triangle on the roof, yellow at the foot
function atlantis(c, x, b) {
  const w = 112, h = 76, top = b - h, col = MV.teal;
  body(c, () => { c.beginPath(); c.rect(x, top, w, h); }, col, 1);
  c.fillStyle = rgba(MV.blue, 0.28); c.fillRect(x + 0.6, top + 0.6, w - 1.2, h - 1.2);
  trim(c, () => { c.beginPath(); for (let i = 5.6; i < w - 1; i += 5.6) { c.moveTo(x + i, top + 1); c.lineTo(x + i, b - 1); } for (let j = 3.8; j < h - 1; j += 3.8) { c.moveTo(x + 1, top + j); c.lineTo(x + w - 1, top + j); } }, MV.white, 0.35, true);
  wins(c, x, top, w, h, 5.6, 3.8, 3, MV.white, 0.35, 1.2);
  // the sky court: a square cut clean through, sky showing behind it
  const hx = x + 66, hy = top + 11, hs = 22;
  c.save(); c.globalCompositeOperation = 'destination-out'; c.fillStyle = '#000'; c.fillRect(hx, hy, hs, hs); c.restore();
  trim(c, () => { c.beginPath(); c.rect(hx, hy, hs, hs); }, MV.white, 0.8);
  c.strokeStyle = MV.red; c.lineWidth = 1.1; c.beginPath(); for (let k = 0; k < 9; k++) { const yy = hy + 3.5 + k * 2; c.moveTo(hx + 3, yy); c.quadraticCurveTo(hx + 6, yy - 1.2, hx + 8.5, yy + 0.6); } c.moveTo(hx + 5.6, hy + 3); c.lineTo(hx + 5.6, hy + hs - 3); c.stroke();
  miniPalm(c, hx + 15, hy + hs - 1.5, 13, 1.5, 6);
  c.fillStyle = rgba(MV.teal, 0.8); c.fillRect(hx + 2.5, hy + hs - 4.5, 7, 2.6);
  accent(c, () => { c.beginPath(); c.moveTo(x + 2, top); c.lineTo(x + 2, top - 15); c.lineTo(x + 17, top); c.closePath(); }, MV.red);
  accent(c, () => { c.beginPath(); c.moveTo(x + w, b); c.lineTo(x + w - 14, b); c.lineTo(x + w, b - 14); c.closePath(); }, MV.yellow);
  trim(c, () => { c.beginPath(); c.moveTo(x - 2, b - 2.5); c.lineTo(x + w + 2, b - 2.5); }, MV.white, 0.6, true);
}

// ---- Miami Tower (I.M. Pei, 1987): three tiers stepping back, each with a rounded end, floodlit in changing colours,
//      ribbon windows, the Knight Center podium with the Metromover running through it
function miamiTower(c, x, b) {
  const tiers = [[48, 46, MV.pink], [40, 40, '#b04dff'], [32, 38, MV.teal]];
  let y = b - 14, left = x;
  body(c, () => { c.beginPath(); c.rect(x - 6, b - 14, 62, 14); }, MV.silver, 0.8);
  trim(c, () => { c.beginPath(); c.moveTo(x - 14, b - 8); c.lineTo(x + 64, b - 8); }, MV.white, 1);
  c.fillStyle = rgba(MV.yellow, 0.5); c.fillRect(x - 12, b - 10.5, 9, 2.5);
  tiers.forEach(([w, h, col], i) => {
    y -= h; left = x + i * 3;
    if (BK) BK.tiers.push({ left, y, w, h });
    body(c, () => { c.beginPath(); c.moveTo(left, y + h); c.lineTo(left, y); c.lineTo(left + w - 12, y); c.arcTo(left + w, y, left + w, y + 12, 12); c.lineTo(left + w, y + h); c.closePath(); }, col, 1);
    c.fillStyle = rgba(col, 0.26); c.fillRect(left + 0.6, y + 0.6, w - 1.2, h - 1.2);
    cylShade(c, left + w - 16, y + 0.6, 15.4, h - 1.2, col, 0.3);
    trim(c, () => { c.beginPath(); for (let j = 4; j < h - 1; j += 4) { c.moveTo(left + 1.5, y + j); c.lineTo(left + w - (j < 12 ? 12 - Math.sqrt(144 - (12 - j) * (12 - j)) : 0) - 1.5, y + j); } }, MV.white, 0.35, true);
    wins(c, left, y, w - 4, h, 3.6, 4, 7 + i, MV.white, 0.45, 1.3);
  });
  trim(c, () => { c.beginPath(); c.moveTo(left + 9, y); c.lineTo(left + 9, y - 16); }, MV.white, 0.9);
  beacon(c, left + 9, y - 17, 1.1);
}

// ---- Freedom Tower (1925, Giralda-style): wide salmon base with a cream cornice, the tower shaft with corner quoins,
//      three arched tiers stepping in, the lantern dome
function freedomTower(c, x, b) {
  const col = MV.salmon, cream = MV.silver, W = 56, cx = x + W / 2;
  body(c, () => { c.beginPath(); c.rect(x, b - 44, W, 44); }, col, 0.9);
  c.fillStyle = rgba(col, 0.13); c.fillRect(x + 0.6, b - 43.4, W - 1.2, 42.8);
  for (let k = 0; k < 6; k++) arch(c, x + 5.5 + k * 9, b - 12, 5, 12, MV.yellow, 0.3);
  wins(c, x + 1, b - 40, W - 2, 26, 4.6, 4.4, 5, MV.yellow, 0.55, 1.6);
  body(c, () => { c.beginPath(); c.rect(x - 1.5, b - 47, W + 3, 3); }, cream, 0.6);
  trim(c, () => { c.beginPath(); for (let i = 2; i < W + 3; i += 2.2) { c.moveTo(x - 1.5 + i, b - 47); c.lineTo(x - 1.5 + i, b - 45.5); } }, cream, 0.4, true);
  // shaft
  body(c, () => { c.beginPath(); c.rect(cx - 11, b - 92, 22, 45); }, col, 0.9);
  c.fillStyle = rgba(col, 0.13); c.fillRect(cx - 10.4, b - 91.4, 20.8, 43.8);
  wins(c, cx - 10, b - 90, 20, 42, 4.4, 5, 9, MV.yellow, 0.6, 1.6);
  trim(c, () => { c.beginPath(); for (let j = 0; j < 44; j += 4) { c.moveTo(cx - 11, b - 92 + j); c.lineTo(cx - 9, b - 92 + j); c.moveTo(cx + 11, b - 92 + j); c.lineTo(cx + 9, b - 92 + j); } }, cream, 0.5, true);
  // three tiers with arched openings and balustrades, then the dome
  let ty = b - 92; const tiers = [[18, 11, 4], [13, 9, 3], [9, 8, 2]];
  for (const [tw, th, n] of tiers) {
    body(c, () => { c.beginPath(); c.rect(cx - tw / 2 - 1.5, ty - 2, tw + 3, 2); }, cream, 0.5);
    ty -= th + 2;
    body(c, () => { c.beginPath(); c.rect(cx - tw / 2, ty, tw, th); }, col, 0.8);
    c.fillStyle = rgba(col, 0.13); c.fillRect(cx - tw / 2 + 0.5, ty + 0.5, tw - 1, th - 1);
    for (let k = 0; k < n; k++) arch(c, cx - tw / 2 + tw * (k + 0.5) / n, ty + 2, tw / n - 1.6, th - 3.5, MV.yellow, 0.4);
  }
  accent(c, () => { c.beginPath(); c.moveTo(cx - 5, ty); c.quadraticCurveTo(cx - 5, ty - 7, cx, ty - 7.5); c.quadraticCurveTo(cx + 5, ty - 7, cx + 5, ty); c.closePath(); }, cream);
  trim(c, () => { c.beginPath(); c.moveTo(cx, ty - 7.5); c.lineTo(cx, ty - 14); }, MV.yellow, 0.9);
  beacon(c, cx, ty - 15, 1);
}

// ---- One Thousand Museum (Zaha Hadid, 2019): glass tower wrapped in the white curving exoskeleton, dense at the
//      foot and the crown, opening up through the middle, the rooftop helipad crown
function thousandMuseum(c, x, b) {
  const w = 32, h = 140, top = b - h, col = MV.white;
  body(c, () => { c.beginPath(); c.rect(x, top, w, h); }, col, 0.8);
  c.fillStyle = rgba(MV.teal, 0.2); c.fillRect(x + 0.6, top + 0.6, w - 1.2, h - 1.2);
  wins(c, x, top, w, h, 3.2, 3.2, 19, MV.teal, 0.45, 1.3);
  // exoskeleton ribs: sweeping curves up each side, lattice at the bottom and the top
  trim(c, () => {
    c.beginPath();

// ---- flying flamingo, facing right. s = size (1 = about 28 px wingspan), flap = -1 (wings up) .. 1 (wings down)
function flamingo(c, x, y, s, flap, col) {
  col = col || MV.pink; const ink = MV.ink;
  c.save(); c.translate(x, y); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round';
  const u = (flap + 1) / 2, tip = { x: -3 - 5 * (1 - flap * flap) - 3 * Math.max(0, flap), y: -12 + 19 * Math.pow(u, 1.4) };
  const wing = (sh, tp, back, dark) => {
    const mx = (sh.x + tp.x) / 2, my = (sh.y + tp.y) / 2, dx = tp.x - sh.x, dy = tp.y - sh.y, n = Math.hypot(dx, dy) || 1, px = -dy / n, py = dx / n;

const SPR_PAL = ['#0b0c10', '#1b1e24', '#2c313a', '#454b56', '#6b7382', '#9aa3b1', '#d6dde6', '#c9a84c', '#55c8f2', '#e8f0fa'];
const SPR = { ox: 17, oy: 8, propY: -9, propX: [-12.5, 11.5], rows: [
  '...0000....000000000000....0000...',
  '..033330..03313333313330..033330..',
  '..011110..02212666212220..011110..',
  '.03333330.02212555212220.03333330.',
  '.02222220002212222212220002222220.',
  '.02222223332212222212223332222220.',
  '.02222222233333333333333222222220.',
  '..002100002222222222222111002100..',

function buildSprite() {

function drawPixelDrone() {

}
let netPattern = null;
function pixelSky() {
  const bands = PXC.sky, gy = P(GY), bh = gy / bands.length;
  for (let i = 0; i < bands.length; i++) { lctx.fillStyle = bands[i]; lctx.fillRect(0, Math.floor(i * bh), lo.width, Math.ceil(bh) + 1); }
}
function pixelTrees(L, off, color, baseY) {
  lctx.fillStyle = color;
  const by = P(baseY);
  for (const rep of [0, 1]) {
    const x0 = -off + rep * L.span;
    for (const tr of L.a) {
      const x = x0 + tr.x;
      if (x > W || x + tr.w < 0) continue;
      const px = P(x), pw = Math.max(2, P(tr.w)), ph = Math.max(3, P(tr.h));
      if (tr.round) {
        const prof = [0.55, 0.85, 1, 1, 0.9, 0.6];
        const rh = Math.max(1, Math.round(ph * 0.7 / prof.length));
        for (let i = 0; i < prof.length; i++) { const ww = Math.max(1, Math.round(pw * prof[i])); lctx.fillRect(px + Math.round((pw - ww) / 2), by - ph + i * rh, ww, rh); }

      } else {
        const steps = 5, sh = Math.max(1, Math.round(ph / steps));
        for (let i = 0; i < steps; i++) { const ww = Math.max(1, Math.round(pw * (i + 1) / steps)); lctx.fillRect(px + Math.round((pw - ww) / 2), by - ph + i * sh, ww, sh); }

function pixelTower(x, baseY) {
  const bx = P(x), by = P(baseY), h = P(150), top = by - h - 2;
  lctx.fillStyle = '#18243c';
  lctx.fillRect(bx - 1, by - h, 2, h);

function pixelNetSeg(x, y, w, h, top) {

  lctx.fillStyle = PXC.g2; lctx.fillRect(0, gy + Math.round(gh * 0.45), lo.width, gh);
  lctx.fillStyle = PXC.g3; lctx.fillRect(0, gy + Math.round(gh * 0.75), lo.width, gh);
  lctx.fillStyle = PXC.grass; lctx.fillRect(0, gy, lo.width, 2);

function pixelParts() {
  for (const p of parts) {
    const k = p.age / p.life, x = P(p.x), y = P(p.y);
    if (p.kind === 'ring') { lctx.globalAlpha = 1 - k; pcircle(x, y, Math.round((10 + k * 140) / PX), '#ffdca0'); lctx.globalAlpha = 1; }
    else if (p.kind === 'fire') { lctx.fillStyle = k < 0.3 ? '#fff0b4' : k < 0.6 ? '#ff9628' : '#783c1e'; const s = Math.max(1, Math.round(p.sz * (1 - k * 0.6) / PX)); lctx.fillRect(x, y, s, s); }

function pixelOSD() {
